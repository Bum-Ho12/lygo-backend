[alembic]
script_location = %(here)s/app/db/migrations
prepend_sys_path = .
# URL comes from DATABASE_MIGRATOR_URL (owner role); override with -x url=... or set_main_option.
sqlalchemy.url =

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
