name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --frozen
      - run: uv run ruff check app tests
      - run: uv run mypy app
      - run: uv run bandit -q -r app -ll
      - run: uv run pip-audit --skip-editable
      - run: uv run pytest tests/unit -q

  # Required check. Runs against a real Postgres with the non-owner app role (see scripts/init-db.sql).
  tenancy:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: lygo_owner, POSTGRES_PASSWORD: lygo_owner, POSTGRES_DB: lygo }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lygo_owner" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --frozen
      - run: PGPASSWORD=lygo_owner psql -h localhost -U lygo_owner -d lygo -f scripts/init-db.sql
      - run: uv run pytest tests/tenancy tests/integration -q
        env: { REQUIRE_DB: "1" }
