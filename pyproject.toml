[project]
name = "lygo-backend"
version = "0.1.0"
description = "Lygo multi-tenant legal data platform — API, ingestion, rules and AI engines"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic[email]>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pgvector>=0.3",
  "celery[redis]>=5.4",
  "redis>=5.0",
  "boto3>=1.34",
  "httpx>=0.27",
  "argon2-cffi>=23.1",
  "pyjwt>=2.9",
  "pyotp>=2.9",
  "python-multipart>=0.0.9",
  "pymupdf>=1.24",
  "pdfplumber>=0.11",
  "python-docx>=1.1",
  "pandas>=2.2",
  "pytesseract>=0.3",
  "pyyaml>=6.0",
  "structlog>=24.1",
  "opentelemetry-sdk>=1.26",
  "cryptography>=50.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "testcontainers>=4.7",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "types-PyYAML>=6.0",
    "moto[s3]>=5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["celery", "celery.*", "boto3", "botocore", "botocore.*", "pytesseract", "pymupdf", "docx", "moto", "moto.*"]
ignore_missing_imports = true

[tool.setuptools.package-data]
app = ["engine/packs/**/*.yaml"]
