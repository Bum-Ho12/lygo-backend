services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lygo_owner
      POSTGRES_PASSWORD: lygo_owner
      POSTGRES_DB: lygo
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data, ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  api:
    build: .
    env_file: .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    depends_on: [db, redis, minio]

  worker:
    build: .
    env_file: .env
    command: celery -A app.workers.celery_app worker -Q ingest,ai,notify -l info
    depends_on: [db, redis, minio]

volumes:
  pgdata:
  miniodata:
